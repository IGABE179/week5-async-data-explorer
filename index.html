<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShopScope – Async Data Explorer</title>
  </head>
  <body class="min-h-screen bg-mist/20 text-slate-800">
    <header class="bg-navy px-4 py-8 text-white">
      <div class="mx-auto max-w-6xl">
        <h1 class="text-3xl font-bold tracking-tight sm:text-4xl">ShopScope</h1>
        <p class="mt-1 text-mist">Browse, search, filter and sort a product catalogue, loaded live from the DummyJSON API.</p>
      </div>
    </header>

    <main class="mx-auto max-w-6xl px-4 py-6">
      <!-- Controls -->
      <form id="controls" class="grid gap-3 rounded-2xl bg-white p-4 shadow-sm ring-1 ring-slate-200 sm:grid-cols-3" role="search">
        <div>
          <label for="search" class="label">Search</label>
          <input id="search" type="search" class="field" placeholder="Product or brand…" autocomplete="off" />
        </div>
        <div>
          <label for="filter" class="label">Category</label>
          <select id="filter" class="field">
            <option value="all">All categories</option>
          </select>
        </div>
        <div>
          <label for="sort" class="label">Sort by</label>
          <select id="sort" class="field">
            <option value="default">Default order</option>
            <option value="price-asc">Price (low to high)</option>
            <option value="price-desc">Price (high to low)</option>
            <option value="rating-desc">Rating (best first)</option>
            <option value="name-asc">Name (A–Z)</option>
          </select>
        </div>
      </form>

      <!-- Stats bar (filled by render) -->
      <section id="stats" class="mt-6 grid grid-cols-2 gap-3 lg:grid-cols-4" aria-label="Statistics" hidden></section>

      <!-- Status message: loading, empty, error and result count -->
      <div id="status" class="mt-6 text-center text-slate-600" aria-live="polite"></div>

      <!-- Results -->
      <ul id="results" class="mt-6 grid gap-4 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4" aria-label="Products"></ul>
    </main>

    <!-- Product card template -->
    <template id="card-template">
      <li>
        <button type="button" class="product-card">
          <img class="h-40 w-full border-b border-slate-200 bg-white object-contain p-2" loading="lazy" />
          <div class="flex flex-1 flex-col gap-1 p-4">
            <span class="card-category self-start rounded-full bg-mist/40 px-3 py-0.5 text-xs font-semibold text-navy"></span>
            <h2 class="card-title mt-1 font-bold text-navy"></h2>
            <p class="card-brand text-sm text-slate-500"></p>
            <div class="mt-auto flex items-center justify-between pt-2">
              <span class="card-price text-lg font-bold text-navy"></span>
              <span class="card-rating text-sm font-semibold text-gold"></span>
            </div>
          </div>
        </button>
      </li>
    </template>

    <!-- Product details dialog -->
    <dialog id="details" class="m-auto w-[min(90vw,32rem)] rounded-2xl p-0 shadow-xl backdrop:bg-navy/60" aria-label="Product details">
      <img id="details-image" class="h-56 w-full border-b border-slate-200 bg-white object-contain p-4" alt="" hidden />
      <div class="p-6">
        <div id="details-body"></div>
        <form method="dialog" class="mt-6 text-right">
          <button class="btn-primary">Close</button>
        </form>
      </div>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
